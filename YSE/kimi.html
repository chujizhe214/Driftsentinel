<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriftSentinel · 压力测试向导</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel-2:#f1f3f6; --panel-3:#e9edf2;
  --border:#e2e6ec; --border-2:#cfd6df;
  --text:#1f2328; --text-2:#5a6572; --text-3:#8a95a3;
  --indigo:#5850ec; --indigo-soft:#eeedfd;
  --orange:#d9711e; --orange-soft:#fdf0e5;
  --green:#1a7f4b; --green-soft:#e5f5ec;
  --amber:#a66b00; --amber-soft:#fdf3e0;
  --red:#c9352b; --red-soft:#fdecea;
  --mono:'SF Mono',Menlo,Consolas,'Cascadia Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 顶栏 ---------- */
.topbar{
  background:var(--panel);border-bottom:1px solid var(--border);
  padding:0 32px;position:sticky;top:0;z-index:30;
}
.topbar-inner{
  max-width:1240px;margin:0 auto;height:62px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{
  width:28px;height:28px;border-radius:8px;background:var(--indigo);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;
}
.logo h1{font-size:15px;font-weight:600;letter-spacing:-.2px}
.logo .sub{font-size:11.5px;color:var(--text-3);margin-left:2px}
.top-actions{display:flex;align-items:center;gap:8px}
.btn{
  padding:7px 15px;border-radius:8px;border:1px solid var(--border-2);
  background:var(--panel);color:var(--text);font-size:12.5px;transition:.13s;
}
.btn:hover{background:var(--panel-2);border-color:var(--text-3)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:500}
.btn.primary:hover{background:#4a41d8;border-color:#4a41d8}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--panel-2);border-color:var(--panel-2)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- 步骤条 ---------- */
.wizard-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:18px 32px 16px}
.wizard-inner{max-width:1240px;margin:0 auto}
.steps{display:flex;align-items:flex-start}
.step-item{flex:1;text-align:center;position:relative;cursor:pointer}
.step-item .bar{
  position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--border-2);z-index:0;
}
.step-item:last-child .bar{display:none}
.step-item.done .bar{background:var(--indigo)}
.step-item .dot{
  width:28px;height:28px;border-radius:50%;background:var(--panel);
  border:2px solid var(--border-2);color:var(--text-3);
  display:inline-grid;place-items:center;font-size:12px;font-weight:600;
  position:relative;z-index:1;transition:.15s;font-family:var(--mono);
}
.step-item.done .dot{background:var(--indigo);border-color:var(--indigo);color:#fff}
.step-item.current .dot{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-soft)}
.step-item.current .dot{box-shadow:0 0 0 4px var(--indigo-soft)}
.step-item .lbl{font-size:12px;color:var(--text-3);margin-top:7px;font-weight:500}
.step-item.current .lbl{color:var(--indigo);font-weight:600}
.step-item.done .lbl{color:var(--text-2)}
.step-item:hover .dot{border-color:var(--indigo)}
.progress-note{font-size:11.5px;color:var(--text-3);text-align:center;margin-top:12px}

/* ---------- 主区 ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:32px 32px 0}
.page-head{margin-bottom:24px}
.page-head h2{font-size:24px;font-weight:600;letter-spacing:-.5px}
.page-head p{font-size:14px;color:var(--text-2);margin-top:8px;max-width:78ch;line-height:1.7}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  padding:24px;margin-bottom:20px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.card-head h3{font-size:15px;font-weight:600}
.card-head p{font-size:12.5px;color:var(--text-3);margin-top:4px;max-width:76ch;line-height:1.6}
.grid{display:grid;gap:20px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

/* ---------- 指标 ---------- */
.stat{background:var(--panel-2);border-radius:10px;padding:16px 18px}
.stat .lbl{font-size:12px;color:var(--text-2);margin-bottom:7px}
.stat .val{font-size:26px;font-weight:600;font-family:var(--mono);letter-spacing:-.6px;line-height:1.15}
.stat .hint{font-size:11.5px;color:var(--text-3);margin-top:6px}
.good{color:var(--green)} .bad{color:var(--red)} .flat{color:var(--text-3)} .shift{color:var(--amber)}
.muted{color:var(--text-3)}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:10px 12px;font-weight:500;color:var(--text-2);
  border-bottom:1px solid var(--border-2);font-size:12px;white-space:nowrap;
  background:var(--panel-2);
}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
.num-cell{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border-radius:8px}
.tbl-wrap table{border:1px solid var(--border);border-radius:8px;overflow:hidden}

/* ---------- 标签 ---------- */
.tag{
  display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;
  font-size:11.5px;font-weight:500;white-space:nowrap;
}
.t-ok{background:var(--green-soft);color:var(--green)}
.t-warn{background:var(--amber-soft);color:var(--amber)}
.t-crit{background:var(--red-soft);color:var(--red)}
.t-info{background:var(--indigo-soft);color:var(--indigo)}
.t-neutral{background:var(--panel-3);color:var(--text-2)}
.t-orange{background:var(--orange-soft);color:var(--orange)}

/* ---------- 表单 ---------- */
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:7px}
.field .help{font-size:12px;color:var(--text-3);margin-top:6px;line-height:1.55}
input[type=text],select,textarea{
  width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border-2);
  background:var(--panel);color:var(--text);font-size:13px;font-family:inherit;
}
input:focus,select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-soft)}
textarea{font-family:var(--mono);font-size:12px;line-height:1.6}
.upload-zone{
  border:2px dashed var(--border-2);border-radius:12px;padding:34px 24px;text-align:center;
  background:var(--panel-2);transition:.15s;
}
.upload-zone:hover{border-color:var(--indigo);background:var(--indigo-soft)}
.upload-zone .icon{font-size:26px;margin-bottom:10px}
.upload-zone h4{font-size:14px;font-weight:600;margin-bottom:6px}
.upload-zone p{font-size:12.5px;color:var(--text-3)}

/* ---------- 场景卡片 ---------- */
.scenario-card{
  border:1px solid var(--border-2);border-radius:12px;padding:16px 18px;
  background:var(--panel);cursor:pointer;transition:.15s;position:relative;
}
.scenario-card:hover{border-color:var(--indigo)}
.scenario-card.on{border-color:var(--indigo);background:var(--indigo-soft);box-shadow:0 0 0 2px var(--indigo-soft)}
.scenario-card h4{font-size:13.5px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.scenario-card p{font-size:12px;color:var(--text-2);line-height:1.6;margin-bottom:10px}
.scenario-card .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.check{
  position:absolute;top:14px;right:14px;width:18px;height:18px;border-radius:5px;
  border:1.5px solid var(--border-2);display:grid;place-items:center;font-size:11px;color:transparent;
}
.scenario-card.on .check{background:var(--indigo);border-color:var(--indigo);color:#fff}

/* ---------- 结论 ---------- */
.verdict{border-left:3px solid var(--border-2);padding:4px 0 4px 16px;margin-bottom:18px}
.verdict:last-child{margin-bottom:0}
.verdict h4{font-size:13.5px;font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:8px}
.verdict p{font-size:13px;color:var(--text-2);line-height:1.75}
.verdict.observed{border-color:var(--indigo)}
.verdict.impact{border-color:var(--red)}
.verdict.safe{border-color:var(--green)}
.verdict.nolabel{border-color:var(--amber)}

.notice{
  background:var(--amber-soft);border:1px solid #f0dcc0;border-radius:10px;
  padding:14px 16px;font-size:13px;color:#7a4a00;line-height:1.7;
}
.notice.info{background:var(--indigo-soft);border-color:#dcd8fa;color:#3d3590}
.notice strong{color:inherit;font-weight:600}

/* ---------- 代码 ---------- */
pre{
  background:#f8f9fb;border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;overflow:auto;font-family:var(--mono);font-size:12px;
  line-height:1.65;color:#2d3748;max-height:400px;
}

/* ---------- 图表 ---------- */
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:12px;font-size:12px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}

/* ---------- 混淆矩阵 ---------- */
.cm{display:grid;grid-template-columns:56px repeat(2,1fr);gap:5px;font-size:12px;max-width:380px}
.cm .hd{color:var(--text-3);font-size:11.5px;text-align:center;padding:5px}
.cm .lbl{color:var(--text-3);font-size:11.5px;display:grid;place-items:center;text-align:right;padding-right:8px}
.cm .cell{padding:16px 8px;border-radius:9px;text-align:center;font-family:var(--mono);font-size:17px;font-weight:600}
.cm .cell small{display:block;font-size:10.5px;font-weight:400;opacity:.8;margin-top:4px;font-family:inherit}
.cm .tp{background:var(--green-soft);color:var(--green)}
.cm .fp{background:var(--red-soft);color:var(--red)}
.cm .fn{background:var(--amber-soft);color:var(--amber)}
.cm .tn{background:var(--indigo-soft);color:var(--indigo)}

.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-family:var(--mono);text-align:right}
hr.sep{border:none;border-top:1px solid var(--border);margin:18px 0}

/* ---------- 底部导航 ---------- */
.footnav{
  position:sticky;bottom:0;background:rgba(246,247,249,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);margin-top:28px;
}
.footnav-inner{
  max-width:1240px;margin:0 auto;padding:16px 32px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.footnav .hint{font-size:12.5px;color:var(--text-3)}
.footnav .actions{display:flex;gap:10px}

.pill-row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  padding:6px 13px;border-radius:20px;border:1px solid var(--border-2);
  background:var(--panel);font-size:12.5px;color:var(--text-2);
}
.pill.on{background:var(--indigo-soft);border-color:var(--indigo);color:var(--indigo);font-weight:500}

@media(max-width:900px){
  .wrap,.topbar-inner,.footnav-inner{padding-left:18px;padding-right:18px}
  .step-item .lbl{font-size:10.5px}
  .page-head h2{font-size:20px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <span class="mark">DS</span>
      <h1>DriftSentinel</h1>
      <span class="sub">压力测试向导</span>
    </div>
    <div class="top-actions">
      <span class="tag t-ok">本地运行</span>
      <button class="btn ghost" onclick="go('report')">查看报告</button>
      <button class="btn primary" onclick="downloadCfg()">导出配置</button>
    </div>
  </div>
</header>

<div class="wizard-bar">
  <div class="wizard-inner">
    <div class="steps" id="steps"></div>
    <div class="progress-note" id="progressNote"></div>
  </div>
</div>

<main class="wrap">
  <div id="content"></div>
</main>

<footer class="footnav">
  <div class="footnav-inner">
    <div class="hint" id="footHint"></div>
    <div class="actions">
      <button class="btn" id="btnPrev" onclick="prev()">上一步</button>
      <button class="btn primary" id="btnNext" onclick="next()">下一步</button>
    </div>
  </div>
</footer>

  document.querySelectorAll('[data-step]').forEach(el => el.onclick = () => go(el.dataset.step));

const card = (title, desc, body) => `
  <section class="card">
    <div class="card-head"><div><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ''}</div></div>
    ${body}
  </section>`;

const statCard = (lbl, val, hint = '') => `
  <div class="stat"><div class="lbl">${lbl}</div><div class="val">${val}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`;

function riskTag(psi, warn = 0.10, crit = 0.20) {
  if (psi >= crit) return '<span class="tag t-crit">严重</span>';
  if (psi >= warn) return '<span class="tag t-warn">预警</span>';
  return '<span class="tag t-ok">正常</span>';
}
function deltaCell(base, cur, digits = 4) {
  const d = cur - base;
  if (Math.abs(d) < 1e-9) return '<span class="flat">±0.0000</span>';
  return `<span class="${d < 0 ? 'bad' : 'good'}">${d > 0 ? '+' : ''}${d.toFixed(digits)}</span>`;
}
function deltaNeutral(base, cur, digits = 4) {
  const d = cur - base;
  if (Math.abs(d) < 1e-9) return '<span class="flat">±0.0000</span>';
  return `<span class="${Math.abs(d) > 0.01 ? 'shift' : 'flat'}">${d > 0 ? '+' : ''}${d.toFixed(digits)}</span>`;
}

/* ---------- SVG 图表 ---------- */
const C = { indigo: '#5850ec', orange: '#d9711e', green: '#1a7f4b', amber: '#d9a441',
            red: '#c9352b', grid: '#e2e6ec', text: '#5a6572', dim: '#8a95a3' };

const svgOpen = (w, h) => `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">`;
const legend = items => `<div class="legend">${items.map(i =>
  `<span><i style="background:${i.c}"></i>${i.t}</span>`).join('')}</div>`;

function histChart(hist, w = 640, h = 250) {
  const pad = { l: 48, r: 16, t: 16, b: 40 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const maxV = Math.max(...hist.ref, ...hist.cur);
  const n = hist.edges.length - 1;
  const bw = iw / n;
  let s = svgOpen(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - (ih * g / 4);
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<text x="${pad.l - 9}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.dim}" font-family="monospace">${Math.round(maxV * g / 4)}</text>`;
  }
  for (let i = 0; i < n; i++) {
    const hR = ih * hist.ref[i] / maxV, hC = ih * hist.cur[i] / maxV;
    const x = pad.l + i * bw;
    s += `<rect x="${x + 1.5}" y="${pad.t + ih - hR}" width="${bw - 3}" height="${hR}" fill="${C.indigo}" opacity="0.3"/>`;
    s += `<rect x="${x + 1.5}" y="${pad.t + ih - hC}" width="${bw - 3}" height="${hC}" fill="${C.orange}" opacity="0.45" stroke="${C.orange}" stroke-width="0.75"/>`;
  }
  s += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t + ih}" stroke="${C.border || C.grid}" stroke-width="1.5"/>`;
  for (let i = 0; i <= n; i += 2) {
    const x = pad.l + i * bw;
    s += `<text x="${Math.min(x, pad.l + iw)}" y="${h - 18}" text-anchor="middle" font-size="11" fill="${C.dim}" font-family="monospace">${hist.edges[i].toLocaleString()}</text>`;
  }
  s += `<text x="${pad.l + iw / 2}" y="${h - 2}" text-anchor="middle" font-size="11.5" fill="${C.dim}">${hist.field || ''}</text>`;
  return s + '</svg>';
}

function catChart(levels, w = 640) {
  const rowH = 32;
  const h = levels.length * rowH + 14;
  const pad = { l: 66, r: 104, t: 6 };
  const iw = w - pad.l - pad.r;
  const maxV = Math.max(...levels.flatMap(l => [l.ref, l.cur])) || 1;
  let s = svgOpen(w, h);
  levels.forEach((l, i) => {
    const y = pad.t + i * rowH;
    s += `<text x="${pad.l - 11}" y="${y + 17}" text-anchor="end" font-size="12" fill="${C.text}">${l.level}</text>`;
    s += `<rect x="${pad.l}" y="${y + 2}" width="${iw * l.ref / maxV}" height="9" rx="3" fill="${C.indigo}" opacity="0.65"/>`;
    s += `<rect x="${pad.l}" y="${y + 15}" width="${iw * l.cur / maxV}" height="9" rx="3" fill="${C.orange}" opacity="0.8"/>`;
    s += `<text x="${pad.l + iw + 9}" y="${y + 11}" font-size="11" fill="${C.indigo}" font-family="monospace">${(l.ref * 100).toFixed(1)}%</text>`;
    s += `<text x="${pad.l + iw + 9}" y="${y + 24}" font-size="11" fill="${C.orange}" font-family="monospace">${(l.cur * 100).toFixed(1)}%</text>`;
  });
  return s + '</svg>';
}

function metricBars(rows, w = 640, h = 230) {
  const pad = { l: 108, r: 66, t: 12, b: 12 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const rowH = ih / rows.length;
  let s = svgOpen(w, h);
  rows.forEach((r, i) => {
    const y = pad.t + i * rowH;
    s += `<text x="${pad.l - 11}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="12" fill="${C.text}">${r.label}</text>`;
    s += `<rect x="${pad.l}" y="${y + rowH * 0.13}" width="${iw * r.base}" height="11" rx="3" fill="${C.indigo}" opacity="0.65"/>`;
    s += `<rect x="${pad.l}" y="${y + rowH * 0.53}" width="${iw * r.cur}" height="11" rx="3" fill="${C.orange}" opacity="0.8"/>`;
    s += `<text x="${pad.l + iw + 9}" y="${y + rowH * 0.3}" font-size="11" fill="${C.indigo}" font-family="monospace">${r.base.toFixed(3)}</text>`;
    s += `<text x="${pad.l + iw + 9}" y="${y + rowH * 0.72}" font-size="11" fill="${C.orange}" font-family="monospace">${r.cur.toFixed(3)}</text>`;
  });
  return s + '</svg>';
}

function rocChart(rocA, rocB, w = 360, h = 300) {
  const pad = { l: 46, r: 14, t: 14, b: 38 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  let s = svgOpen(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - ih * g / 4;
    const x = pad.l + iw * g / 4;
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<text x="${pad.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.dim}" font-family="monospace">${g / 4}</text>`;
    s += `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${pad.t + ih}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<text x="${x}" y="${h - 18}" text-anchor="middle" font-size="11" fill="${C.dim}" font-family="monospace">${g / 4}</text>`;
  }
  s += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t}" stroke="${C.grid}" stroke-width="1.2" stroke-dasharray="4 4"/>`;
  const path = roc => 'M' + roc.map(p => `${pad.l + p.fpr * iw},${pad.t + ih - p.tpr * ih}`).join(' L');
  s += `<path d="${path(rocB)}" fill="none" stroke="${C.orange}" stroke-width="2"/>`;
  s += `<path d="${path(rocA)}" fill="none" stroke="${C.indigo}" stroke-width="2"/>`;
  s += `<text x="${pad.l + iw / 2}" y="${h - 2}" text-anchor="middle" font-size="11.5" fill="${C.dim}">False positive rate</text>`;
  return s + '</svg>';
}

function sweepChart(rows, w = 640, h = 260) {
  const pad = { l: 48, r: 16, t: 16, b: 42 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xs = rows.map(r => r.threshold);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const series = [
    { key: 'false_alarm_rate', c: C.red },
    { key: 'miss_rate', c: C.amber },
    { key: 'recall', c: C.green },
    { key: 'precision', c: C.indigo },
  ];
  let s = svgOpen(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - ih * g / 4;
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="1"/>`;
    s += `<text x="${pad.l - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${C.dim}" font-family="monospace">${g * 25}%</text>`;
  }
  const X = v => pad.l + (v - xmin) / (xmax - xmin || 1) * iw;
  const Y = v => pad.t + ih - v * ih;
  series.forEach(se => {
    const pts = rows.map(r => `${X(r.threshold)},${Y(r[se.key])}`).join(' L');
    s += `<path d="M${pts}" fill="none" stroke="${se.c}" stroke-width="2"/>`;
    rows.forEach(r => { s += `<circle cx="${X(r.threshold)}" cy="${Y(r[se.key])}" r="3" fill="${se.c}"/>`; });
  });
  xs.forEach(v => { s += `<text x="${X(v)}" y="${h - 20}" text-anchor="middle" font-size="11" fill="${C.dim}" font-family="monospace">${v}</text>`; });
  s += `<text x="${pad.l + iw / 2}" y="${h - 2}" text-anchor="middle" font-size="11.5" fill="${C.dim}">阈值</text>`;
  return s + '</svg>';
}

/* 7. 报告与导出 */
function toYaml(obj, indent = 0) {
  const pad = '  '.repeat(indent);
  let out = '';
  Object.entries(obj).forEach(([k, v]) => {
    if (v === null || v === undefined) { out += `${pad}${k}: null\n`; }
    else if (Array.isArray(v)) {
      if (v.length === 0) { out += `${pad}${k}: []\n`; return; }
      out += `${pad}${k}:\n`;
      v.forEach(it => {
        if (it && typeof it === 'object') {
          Object.entries(it).forEach(([ik, iv], idx) => {
            const prefix = idx === 0 ? `${pad}  - ` : `${pad}    `;
            out += iv !== null && typeof iv === 'object'
              ? `${prefix}${ik}:\n${toYaml(iv, indent + 3)}`
              : `${prefix}${ik}: ${typeof iv === 'string' ? `'${iv}'` : iv}\n`;
          });
        } else out += `${pad}  - ${it}\n`;
      });
    }
    else if (typeof v === 'object') out += `${pad}${k}:\n${toYaml(v, indent + 1)}`;
    else out += `${pad}${k}: ${typeof v === 'string' ? `'${v}'` : v}\n`;
  });
  return out;
}

function buildConfig() {
  const c = JSON.parse(JSON.stringify(D.config));
  c.generated_at = '2026-11-13T22:00:00+08:00';
  c.reference = { rows: D.meta.n_rows, seed: D.meta.seed, label_column: D.label };
  c.experiments = D.scenarios.map(s => ({
    id: s.id, detector: s.detector.method, field: s.detector.field,
    f1: s.metrics.f1, f1_delta: Number((s.metrics.f1 - D.baseline.metrics.f1).toFixed(4))
  }));
  return c;
}

  const devShift = D.scenarios.find(s => s.id === 'device_shift');

  return `
  ${card('实验结论摘要', '本次压力测试的核心发现，可直接用于实验报告或上线评审。',
    `<div class="grid g4" style="margin-bottom:20px">
      ${statCard('基准 F1', fmt(b.f1, 4), '基准数据上的模型表现')}
      ${statCard('基准 AUC', fmt(b.auc, 4), 'ROC 曲线下面积')}
      ${statCard('性能下降场景', `${affected.length} / ${imp.length}`, `F1 下降 ≥ ${D.calibration.impact_delta}`)}
      ${statCard('推荐 PSI 预警阈值', fmt(best.threshold, 2), `严重阈值 ${fmt(best.threshold + 0.1, 2)}`)}
    </div>
    <div class="verdict observed">
      <h4>发现 1 · 输入分布确实会发生显著变化</h4>
      <p>income 均值上移 20% 触发 PSI ${fmt(incShift.fields.find(f => f.field === 'income').psi, 3)}，超过预警阈值。
      随着强度从 +10% 增加到 +30%，PSI 从 0.074 升至 0.538，但 F1 仅下降 0.041——漂移分数与性能影响并不同比例。</p>
    </div>
    <div class="verdict impact">
      <h4>发现 2 · 缺失率是本次实验中最危险的信号</h4>
      <p>support_tickets 缺失率从 ${pct(missUp.fields.find(f => f.field === 'support_tickets').miss_ref, 1)} 升至
      ${pct(missUp.fields.find(f => f.field === 'support_tickets').miss_cur, 1)} 时，F1 由 ${fmt(b.f1, 4)} 降至 ${fmt(missUp.metrics.f1, 4)}，
      是所有场景中降幅最大的一项。该字段同时是模型权重最高的特征（${D.model.coef.support_tickets.toFixed(2)}），应优先纳入监控。</p>
    </div>
    <div class="verdict safe">
      <h4>发现 3 · 漂移显著不代表模型失效</h4>
      <p>device 结构变化使卡方检验 p 值远小于 0.05，但 F1 变化仅 ${fmt(devShift.metrics.f1 - b.f1, 4)}。
      若仅凭漂移分数告警，这里会产生误报。这正是需要把「数据漂移」与「性能下降」分层呈现的原因。</p>
    </div>
    <div class="verdict nolabel">
      <h4>发现 4 · 检验类检测器在大样本下过于敏感</h4>
      <p>在 ${D.meta.n_rows.toLocaleString()} 行样本上，KS 与卡方检验对极小的分布差异也会返回显著 p 值，检验类场景的误报率达到
      ${pct(D.calibration.test.best.false_alarm_rate, 0)}。因此阈值校准必须按检测器家族分别进行，不能用同一套阈值尺度。</p>
    </div>`)}

  <div class="grid g2">
    ${card('YAML 监控配置', '可直接接入线上监控服务的配置格式。',
      `<div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn" onclick="copyCfg('yaml')">复制</button>
        <button class="btn" onclick="downloadCfg()">下载 .yaml</button>
      </div><pre>${toYaml(cfg).replace(/</g, '&lt;')}</pre>`)}

    ${card('JSON 监控配置', '同一份配置的 JSON 表示，便于程序化处理。',
      `<div style="display:flex;gap:8px;margin-bottom:14px">
        <button class="btn" onclick="copyCfg('json')">复制</button>
        <button class="btn" onclick="downloadCfg()">下载 .json</button>
      </div><pre>${JSON.stringify(cfg, null, 2).replace(/</g, '&lt;')}</pre>`)}
  </div>

  ${card('配置包含什么，刻意不包含什么', '本地优先的隐私设计在导出环节同样成立。',
    `<div class="grid g2">
      <div class="verdict observed">
        <h4>包含</h4>
        <p>模型名称与版本、每个字段的检测方法、预警与严重阈值、全局规则（缺失率、预测比例变化、性能下降）、
        监控窗口、最小样本数，以及本次校准的全部实验记录，便于追溯阈值来源。</p>
      </div>
      <div class="verdict nolabel">
        <h4>刻意不包含</h4>
        <p>不包含原始数据、模型权重或任何生产样本。所有敏感内容留在本地；线上侧只拿到阈值与方法约定，
        不需要知道漂移来自哪条具体记录。</p>
      </div>
    </div>
    <div class="notice" style="margin-top:18px">
      <strong>使用提醒：</strong>配置中的阈值来自本次离线压力测试，换数据后需要重新校准，不应直接当作通用标准套用到线上。
    </div>`)}

  ${card('下一步建议', '本原型验证了完整链路，后续按这个顺序推进。',
    `<div class="grid g3">
      ${statCard('接入真实数据', '实现 CSV 上传与字段识别', '当前为演示数据集')}
      ${statCard('对接用户模型', '实现本地模型适配器加载', '当前为内置示例模型')}
      ${statCard('持久化实验', '保存实验历史与配置', '当前刷新即重置')}
    </div>`)}`;
};

/* ---------- 导出 ---------- */
function copyCfg(kind) {
  const cfg = buildConfig();
  const text = kind === 'yaml' ? toYaml(cfg) : JSON.stringify(cfg, null, 2);
  const done = btn => {
    if (!btn) return;
    const o = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = o, 1400);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => done([...document.querySelectorAll('.btn')].find(b => b.textContent === '复制')))
      .catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}
function downloadCfg() {
  const blob = new Blob([toYaml(buildConfig())], { type: 'text/yaml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'monitoring_config.yaml';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- 启动 ---------- */
renderSteps();
go('setup');
</script>
