<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriftSentinel · 模型漂移压力测试与监控工作台</title>
<style>
:root{
  --bg:#0d1017; --panel:#151a23; --panel-2:#1b212c; --panel-3:#222936;
  --border:#28303d; --border-2:#37414f;
  --text:#e3e8ef; --text-2:#9aa5b4; --text-3:#6b7686;
  --blue:#58a6ff; --orange:#f0883e; --teal:#39d0d8; --purple:#a371f7;
  --green:#3fb950; --amber:#d29922; --red:#f85149;
  --mono:'SF Mono',Menlo,Consolas,'Cascadia Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- 布局 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--panel);
  border-right:1px solid var(--border);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.brand h1{font-size:15px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
.brand .mark{
  width:22px;height:22px;border-radius:6px;flex:0 0 22px;
  background:linear-gradient(145deg,var(--teal),var(--blue));
  display:grid;place-items:center;color:#08121c;font-size:12px;font-weight:700;
}
.brand p{font-size:11.5px;color:var(--text-3);margin-top:5px;line-height:1.45}
.nav{padding:12px 10px;flex:1}
.nav-group{margin-bottom:16px}
.nav-group h3{
  font-size:10.5px;font-weight:600;color:var(--text-3);
  text-transform:uppercase;letter-spacing:.7px;padding:0 10px 7px;
}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  color:var(--text-2);font-size:13px;cursor:pointer;transition:background .12s,color .12s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--panel-3);color:var(--text);font-weight:500}
.nav-item .num{
  width:17px;height:17px;border-radius:4px;background:var(--panel-3);
  display:grid;place-items:center;font-size:10px;color:var(--text-3);font-family:var(--mono);flex:0 0 17px;
}
.nav-item.active .num{background:var(--blue);color:#04121f}
.nav-item.done .num{background:rgba(63,185,80,.18);color:var(--green)}
.sidebar-foot{padding:12px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.locale-badge{
  display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;
  background:rgba(63,185,80,.12);color:var(--green);font-size:11px;margin-bottom:8px;
}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 6px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  padding:16px 28px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  background:rgba(13,16,23,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.topbar h2{font-size:16px;font-weight:600;letter-spacing:-.2px}
.topbar .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{
  padding:6px 13px;border-radius:7px;border:1px solid var(--border-2);
  background:var(--panel-2);color:var(--text);font-size:12.5px;transition:.12s;
}
.btn:hover{background:var(--panel-3);border-color:var(--text-3)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#04121f;font-weight:600}
.btn.primary:hover{background:#79b8ff;border-color:#79b8ff}
.btn.ghost{background:transparent}
.content{padding:24px 28px 60px;max-width:1500px;width:100%}

/* ---------- 卡片 ---------- */
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;margin-bottom:16px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}
.card-head h3{font-size:14px;font-weight:600}
.card-head p{font-size:12px;color:var(--text-3);margin-top:3px;max-width:70ch;line-height:1.5}
.grid{display:grid;gap:16px;align-items:start}
.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}

/* ---------- 指标卡 ---------- */
.stat{background:var(--panel-2);border-radius:10px;padding:14px 16px}
.stat .lbl{font-size:11.5px;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stat .val{font-size:23px;font-weight:600;font-family:var(--mono);letter-spacing:-.5px;line-height:1.2}
.stat .delta{font-size:11.5px;margin-top:5px;font-family:var(--mono)}
.up{color:var(--red)} .down{color:var(--green)} .flat{color:var(--text-3)}
.good{color:var(--green)} .bad{color:var(--red)} .shift{color:var(--amber)}
.muted{color:var(--text-3)}
.small{font-size:12px}

/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{
  text-align:left;padding:8px 10px;font-weight:500;color:var(--text-3);
  border-bottom:1px solid var(--border-2);font-size:11.5px;white-space:nowrap;
}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.018)}
.num-cell{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}

/* ---------- 徽章 ---------- */
.tag{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:5px;
  font-size:11px;font-family:var(--mono);white-space:nowrap;
}
.t-ok{background:rgba(63,185,80,.14);color:var(--green)}
.t-warn{background:rgba(210,153,34,.15);color:var(--amber)}
.t-crit{background:rgba(248,81,73,.15);color:var(--red)}
.t-info{background:rgba(88,166,255,.14);color:var(--blue)}
.t-neutral{background:var(--panel-3);color:var(--text-2)}
.t-purple{background:rgba(163,113,247,.15);color:var(--purple)}

/* ---------- 流程步进 ---------- */
.stepper{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0}
.step{
  flex:1;min-width:118px;position:relative;padding:12px 14px 12px 26px;
  background:var(--panel-2);border-right:1px solid var(--border);
}
.step:first-child{border-radius:9px 0 0 9px;padding-left:14px}
.step:last-child{border-right:none;border-radius:0 9px 9px 0}
.step .n{
  font-family:var(--mono);font-size:10.5px;color:var(--text-3);
  display:block;margin-bottom:3px;
}
.step .t{font-size:12.5px;font-weight:500}
.step .s{font-size:11px;color:var(--text-3);margin-top:2px}
.step.done{background:linear-gradient(180deg,rgba(63,185,80,.09),transparent)}
.step.done .n{color:var(--green)}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--blue);height:20px}
input[type=text],select,textarea{
  width:100%;padding:7px 10px;border-radius:7px;border:1px solid var(--border-2);
  background:var(--bg);color:var(--text);font-size:12.5px;font-family:inherit;
}
textarea{font-family:var(--mono);font-size:11.5px;line-height:1.55;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row .val{
  font-family:var(--mono);font-size:12.5px;color:var(--blue);
  min-width:58px;text-align:right;flex:0 0 auto;
}

/* ---------- 图表 ---------- */
.chart{width:100%}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:10px;font-size:11.5px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}

/* ---------- 代码块 ---------- */
pre{
  background:var(--bg);border:1px solid var(--border);border-radius:9px;
  padding:14px 16px;overflow:auto;font-family:var(--mono);font-size:11.5px;
  line-height:1.6;color:#c9d3e0;max-height:420px;
}
pre .k{color:#79b8ff} pre .s{color:#a5d6a7} pre .n{color:#f0883e}
pre .c{color:var(--text-3)}

/* ---------- 结论分层 ---------- */
.verdict{border-left:2px solid var(--border-2);padding:2px 0 2px 14px;margin-bottom:14px}
.verdict h4{font-size:12.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px}
.verdict p{font-size:12.5px;color:var(--text-2);line-height:1.6}
.verdict.observed{border-color:var(--blue)}
.verdict.observed h4{color:var(--blue)}
.verdict.impact{border-color:var(--red)}
.verdict.impact h4{color:var(--red)}
.verdict.nolabel{border-color:var(--amber)}
.verdict.nolabel h4{color:var(--amber)}
.verdict.safe{border-color:var(--green)}
.verdict.safe h4{color:var(--green)}

.notice{
  background:rgba(210,153,34,.08);border:1px solid rgba(210,153,34,.25);
  border-radius:9px;padding:11px 14px;font-size:12.5px;color:#e3c07b;line-height:1.6;
}
.notice.info{background:rgba(88,166,255,.07);border-color:rgba(88,166,255,.22);color:#9dc4f5}
.notice strong{color:var(--text);font-weight:600}

.page{display:none}
.page.active{display:block}
.hidden{display:none !important}

/* 混淆矩阵 */
.cm{display:grid;grid-template-columns:52px repeat(2,1fr);gap:4px;font-size:12px;max-width:420px}
.cm .hd{color:var(--text-3);font-size:11px;text-align:center;padding:4px}
.cm .lbl{color:var(--text-3);font-size:11px;display:grid;place-items:center;text-align:right;padding-right:6px}
.cm .cell{
  padding:12px 8px;border-radius:8px;text-align:center;font-family:var(--mono);
  font-size:15px;font-weight:600;
}
.cm .cell small{display:block;font-size:10.5px;font-weight:400;opacity:.75;margin-top:3px;font-family:inherit}
.cm .tp{background:rgba(63,185,80,.16);color:#7ee787}
.cm .fp{background:rgba(248,81,73,.16);color:#ff9492}
.cm .fn{background:rgba(210,153,34,.16);color:#e3b341}
.cm .tn{background:rgba(88,166,255,.12);color:#79b8ff}

/* 分布条 */
.distbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--panel-3)}
.distbar i{display:block;height:100%}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:12px}
.bar-row .n{width:74px;color:var(--text-2);flex:0 0 74px}
.bar-row .b{flex:1;height:16px;background:var(--panel-3);border-radius:4px;overflow:hidden;position:relative}
.bar-row .b i{display:block;height:100%;background:var(--blue);border-radius:4px}
.bar-row .b i.over{background:var(--orange)}
.bar-row .v{width:46px;text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--text-3);flex:0 0 46px}

.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.pill{
  padding:4px 10px;border-radius:15px;border:1px solid var(--border-2);
  background:var(--panel-2);font-size:12px;color:var(--text-2);
}
.pill.on{background:rgba(88,166,255,.14);border-color:rgba(88,166,255,.4);color:var(--blue)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-3)}
.kv .v{font-family:var(--mono)}
hr.sep{border:none;border-top:1px solid var(--border);margin:16px 0}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1><span class="mark">DS</span>DriftSentinel</h1>
      <p>模型漂移压力测试与监控工作台</p>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="locale-badge"><span class="dot"></span>本地优先 · 数据不出机器</div>
      <div>v1.0 原型 · 演示数据</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h2 id="pageTitle">项目总览</h2>
        <div class="sub" id="pageSub">从基准数据到监控配置的完整链路</div>
      </div>
      <div class="topbar-actions">
        <span class="tag t-neutral" id="datasetTag">—</span>
        <button class="btn ghost" onclick="copyCfg('yaml')">复制 YAML</button>
        <button class="btn ghost" onclick="copyCfg('json')">复制 JSON</button>
        <button class="btn primary" onclick="downloadCfg()">导出监控配置</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

function renderNav() {

function go(id) {

/* ---------- 通用片段 ---------- */
const card = (title, desc, body, extra = '') => `
  <section class="card">
    <div class="card-head">
      <div><h3>${title}</h3>${desc ? `<p>${desc}</p>` : ''}</div>
      ${extra}
    </div>${body}
  </section>`;

const statCard = (lbl, val, delta = '', cls = '', tip = '') => `
  <div class="stat">
    <div class="lbl">${lbl}${tip ? ` <span class="muted" title="${tip}">ⓘ</span>` : ''}</div>
    <div class="val">${val}</div>
    ${delta ? `<div class="delta ${cls}">${delta}</div>` : ''}
  </div>`;

function riskTag(psi, warn = 0.10, crit = 0.20) {
  if (psi >= crit) return '<span class="tag t-crit">严重</span>';
  if (psi >= warn) return '<span class="tag t-warn">预警</span>';
  return '<span class="tag t-ok">正常</span>';
}

/* 指标变化配色：性能退化用红、改善用绿（不使用股票涨跌配色，指标语义不同） */
function deltaCell(base, cur, invert = false, digits = 4) {
  const d = cur - base;
  if (Math.abs(d) < 1e-9) return '<span class="flat">±0.0000</span>';
  const worse = invert ? d < 0 : d < 0;
  const cls = worse ? 'bad' : 'good';
  return `<span class="${cls}">${d > 0 ? '+' : ''}${d.toFixed(digits)}</span>`;
}

/* 比例类变化（预测占比等），方向本身无好坏，用中性色 */
function deltaNeutral(base, cur, digits = 4) {
  const d = cur - base;
  if (Math.abs(d) < 1e-9) return '<span class="flat">±0.0000</span>';
  const cls = Math.abs(d) > 0.01 ? 'shift' : 'flat';
  return `<span class="${cls}">${d > 0 ? '+' : ''}${d.toFixed(digits)}</span>`;
}

/* ---------- SVG 图表工具 ---------- */
const C = { blue: '#58a6ff', orange: '#f0883e', teal: '#39d0d8', green: '#3fb950',
            amber: '#d29922', red: '#f85149', purple: '#a371f7',
            grid: '#28303d', text: '#9aa5b4', dim: '#6b7686' };

function svgOpen(w, h) { return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img">`; }

function legend(items) {
  return `<div class="legend">${items.map(i =>
    `<span><i style="background:${i.c}"></i>${i.t}</span>`).join('')}</div>`;
}

/* 分布对比：基准 vs 场景 直方图 */
function histChart(hist, w = 640, h = 220) {
  const pad = { l: 46, r: 14, t: 14, b: 30 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const maxV = Math.max(...hist.ref, ...hist.cur);
  const n = hist.edges.length - 1;
  const bw = iw / n;
  let s = svgOpen(w, h);
  // 网格
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - (ih * g / 4);
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="0.5"/>`;
    s += `<text x="${pad.l - 8}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${C.dim}" font-family="monospace">${Math.round(maxV * g / 4)}</text>`;
  }
  // 柱
  for (let i = 0; i < n; i++) {
    const hR = ih * hist.ref[i] / maxV, hC = ih * hist.cur[i] / maxV;
    const x = pad.l + i * bw;
    s += `<rect x="${x + 1}" y="${pad.t + ih - hR}" width="${bw - 2}" height="${hR}" fill="${C.blue}" opacity="0.42"/>`;
    s += `<rect x="${x + 1}" y="${pad.t + ih - hC}" width="${bw - 2}" height="${hC}" fill="${C.orange}" opacity="0.5" stroke="${C.orange}" stroke-width="0.5"/>`;
  }
  // x 轴
  s += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t + ih}" stroke="${C.grid}" stroke-width="1"/>`;
  for (let i = 0; i <= n; i += 2) {
    const x = pad.l + i * bw;
    s += `<text x="${Math.min(x, pad.l + iw)}" y="${h - 10}" text-anchor="middle" font-size="10" fill="${C.dim}" font-family="monospace">${hist.edges[i].toLocaleString()}</text>`;
  }
  s += `<text x="${pad.l + iw / 2}" y="${h - 0}" text-anchor="middle" font-size="10" fill="${C.dim}">${hist.field || ''}</text>`;
  s += `</svg>`;
  return s;
}

/* 类别比例对比条 */
function catChart(levels, w = 640) {
  const rowH = 30;
  const h = levels.length * rowH + 26;
  let s = svgOpen(w, h);
  const pad = { l: 62, r: 96, t: 8 };
  const iw = w - pad.l - pad.r;
  const maxV = Math.max(...levels.flatMap(l => [l.ref, l.cur])) || 1;
  levels.forEach((l, i) => {
    const y = pad.t + i * rowH;
    s += `<text x="${pad.l - 10}" y="${y + 15}" text-anchor="end" font-size="11" fill="${C.text}">${l.level}</text>`;
    s += `<rect x="${pad.l}" y="${y + 3}" width="${iw * l.ref / maxV}" height="8" rx="2" fill="${C.blue}" opacity="0.75"/>`;
    s += `<rect x="${pad.l}" y="${y + 14}" width="${iw * l.cur / maxV}" height="8" rx="2" fill="${C.orange}" opacity="0.85"/>`;
    s += `<text x="${pad.l + iw + 8}" y="${y + 12}" font-size="10" fill="${C.blue}" font-family="monospace">${(l.ref*100).toFixed(1)}%</text>`;
    s += `<text x="${pad.l + iw + 8}" y="${y + 23}" font-size="10" fill="${C.orange}" font-family="monospace">${(l.cur*100).toFixed(1)}%</text>`;
  });
  s += `</svg>`;
  return s;
}

/* 指标对比柱状 */
function metricBars(rows, w = 640, h = 200) {
  const pad = { l: 96, r: 66, t: 10, b: 24 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const rowH = ih / rows.length;
  let s = svgOpen(w, h);
  rows.forEach((r, i) => {
    const y = pad.t + i * rowH;
    s += `<text x="${pad.l - 10}" y="${y + rowH / 2 + 4}" text-anchor="end" font-size="11" fill="${C.text}">${r.label}</text>`;
    s += `<rect x="${pad.l}" y="${y + rowH * 0.16}" width="${iw * r.base}" height="10" rx="2" fill="${C.blue}" opacity="0.75"/>`;
    s += `<rect x="${pad.l}" y="${y + rowH * 0.54}" width="${iw * r.cur}" height="10" rx="2" fill="${C.orange}" opacity="0.85"/>`;
    s += `<text x="${pad.l + iw + 8}" y="${y + rowH * 0.28}" font-size="10" fill="${C.blue}" font-family="monospace">${r.base.toFixed(3)}</text>`;
    s += `<text x="${pad.l + iw + 8}" y="${y + rowH * 0.66}" font-size="10" fill="${C.orange}" font-family="monospace">${r.cur.toFixed(3)}</text>`;
  });
  s += `</svg>`;
  return s;
}

/* ROC 曲线 */
function rocChart(rocA, rocB, w = 340, h = 300) {
  const pad = { l: 44, r: 12, t: 12, b: 34 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  let s = svgOpen(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - ih * g / 4;
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="0.5"/>`;
    s += `<text x="${pad.l - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${C.dim}" font-family="monospace">${g / 4}</text>`;
  }
  for (let g = 0; g <= 4; g++) {
    const x = pad.l + iw * g / 4;
    s += `<line x1="${x}" y1="${pad.t}" x2="${x}" y2="${pad.t + ih}" stroke="${C.grid}" stroke-width="0.5"/>`;
    s += `<text x="${x}" y="${h - 16}" text-anchor="middle" font-size="10" fill="${C.dim}" font-family="monospace">${g / 4}</text>`;
  }
  // 对角线
  s += `<line x1="${pad.l}" y1="${pad.t + ih}" x2="${pad.l + iw}" y2="${pad.t}" stroke="${C.grid}" stroke-width="1" stroke-dasharray="3 3"/>`;
  const path = (roc, color) => 'M' + roc.map(p =>
    `${pad.l + p.fpr * iw},${pad.t + ih - p.tpr * ih}`).join(' L');
  s += `<path d="${path(rocB, C.orange)}" fill="none" stroke="${C.orange}" stroke-width="1.6"/>`;
  s += `<path d="${path(rocA, C.blue)}" fill="none" stroke="${C.blue}" stroke-width="1.6"/>`;
  s += `<text x="${pad.l + iw / 2}" y="${h - 2}" text-anchor="middle" font-size="10" fill="${C.dim}">False positive rate</text>`;
  s += `</svg>`;
  return s;
}

/* 阈值权衡折线 */
function sweepChart(rows, w = 640, h = 240) {
  const pad = { l: 44, r: 14, t: 12, b: 36 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xs = rows.map(r => r.threshold);
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const series = [
    { key: 'false_alarm_rate', c: C.red, t: '误报率' },
    { key: 'miss_rate', c: C.amber, t: '漏报率' },
    { key: 'recall', c: C.green, t: '检测召回' },
    { key: 'precision', c: C.blue, t: '检测精确率' },
  ];
  let s = svgOpen(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - ih * g / 4;
    s += `<line x1="${pad.l}" y1="${y}" x2="${pad.l + iw}" y2="${y}" stroke="${C.grid}" stroke-width="0.5"/>`;
    s += `<text x="${pad.l - 7}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="${C.dim}" font-family="monospace">${g * 25}%</text>`;
  }
  const X = v => pad.l + (v - xmin) / (xmax - xmin || 1) * iw;
  const Y = v => pad.t + ih - v * ih;
  series.forEach(se => {
    const pts = rows.map(r => `${X(r.threshold)},${Y(r[se.key])}`).join(' L');
    s += `<path d="M${pts}" fill="none" stroke="${se.c}" stroke-width="1.6"/>`;
    rows.forEach(r => {
      s += `<circle cx="${X(r.threshold)}" cy="${Y(r[se.key])}" r="2.4" fill="${se.c}"/>`;
    });
  });
  xs.forEach(v => {
    s += `<text x="${X(v)}" y="${h - 16}" text-anchor="middle" font-size="10" fill="${C.dim}" font-family="monospace">${v}</text>`;
  });
  s += `<text x="${pad.l + iw / 2}" y="${h - 2}" text-anchor="middle" font-size="10" fill="${C.dim}">阈值</text>`;
  s += `</svg>`;
  return s;
}

/* 字段级漂移条 */
function driftBars(fields, warn, crit) {
  return fields.map(f => {
    const v = f.psi || 0;
    const w = Math.min(100, v / 0.6 * 100);
    const cls = v >= crit ? 't-crit' : v >= warn ? 't-warn' : 't-ok';
    return `
    <div class="bar-row">
      <span class="n">${f.field}</span>
      <span class="b"><i class="${v >= crit ? 'over' : ''}" style="width:${w}%"></i></span>
      <span class="v">${fmt(v, 3)}</span>
      <span class="tag ${cls}">${v >= crit ? '严重' : v >= warn ? '预警' : '正常'}</span>
    </div>`;
  }).join('');
}

VIEWS.impact = () => {
  const sel = D.scenarios.find(s => s.id === SELECTED_SCENARIO);
  const b = D.baseline.metrics;
  const cm = D.baseline.confusion, sc = sel.confusion;
  const it = D.calibration.impact_set.find(i => i.id === sel.id);
  const driftPsi = sel.fields.find(f => f.field === sel.detector.field)?.psi || 0;
  const drifted = sel.detector.method === 'psi' ? driftPsi >= D.calibration.psi.best.threshold
    : sel.detector.method === 'missing' ? (it?.miss_delta || 0) >= 0.10
    : (sel.fields.find(f => f.field === sel.detector.field)?.pvalue ?? 1) < 0.05;

  const methodLabel = { psi: 'PSI', ks: 'KS 统计量', chi_square: '卡方检验', missing: '缺失率变化' }[sel.detector.method];
  const statValue = sel.detector.method === 'psi' ? fmt(driftPsi, 4)
    : sel.detector.method === 'missing' ? fmt(it?.miss_delta, 4)
    : fmt(driftPsi, 4);
  const predShift = Math.abs(sel.metrics.pred_pos_rate - b.pred_pos_rate) > 0.01;

  const driftText = sel.detector.field === '—'
    ? '对照组不施加任何变换，作为检测器自身的误报基线。'
    : `主检测字段 ${sel.detector.field} 的${methodLabel}为 ${statValue}，`
      + (drifted ? '超过阈值，判定输入分布相对基准发生了变化。' : '未超过阈值，输入分布与基准基本一致。');

  return `
  ${card('场景选择', '', `<div class="pill-row">${D.scenarios.map(s =>
    `<button class="pill ${s.id === SELECTED_SCENARIO ? 'on' : ''}" data-sc3="${s.id}">${s.name}</button>`).join('')}</div>`)}

  ${card('分层结论', '严格区分三个层次：有数据变化、模型输出变化、确认性能下降。三者不能互相替代。',
    `<div class="verdict ${drifted ? 'observed' : 'safe'}">
      <h4>① 数据漂移：${drifted ? '已检测到' : '未检测到'}</h4>
      <p>${driftText}</p>
    </div>
    <div class="verdict ${predShift ? 'observed' : 'safe'}">
      <h4>② 预测漂移：模型输出分布${predShift ? '发生变化' : '基本稳定'}</h4>
      <p>预测为正类的比例由 ${pct(b.pred_pos_rate)} 变为 ${pct(sel.metrics.pred_pos_rate)}（${deltaNeutral(b.pred_pos_rate, sel.metrics.pred_pos_rate, 4)}）。
      ${predShift ? '模型对同一批客户的行为已经不同。' : '模型的整体判断倾向未变。'}</p>
    </div>
    <div class="verdict ${it?.impacted ? 'impact' : 'safe'}">
      <h4>③ 性能变化：${it?.impacted ? '确认下降' : '无显著下降'}</h4>
      <p>F1 由 ${fmt(b.f1, 4)} 变为 ${fmt(sel.metrics.f1, 4)}（${deltaCell(b.f1, sel.metrics.f1)}），Recall ${fmt(b.recall, 4)} → ${fmt(sel.metrics.recall, 4)}，AUC ${fmt(b.auc, 4)} → ${fmt(sel.metrics.auc, 4)}。
      ${it?.impacted ? `下降幅度已超过 ${D.calibration.impact_delta}，可判定为真实性能下降。` : `下降幅度未超过 ${D.calibration.impact_delta}，模型在该变换下保持可用。`}</p>
    </div>
    <div class="verdict nolabel">
      <h4>④ 如果没有真实标签会怎样</h4>

VIEWS.calibration = () => {
  const cal = D.calibration;
  const fam = CALIB_FAMILY;
  const rows = cal[fam].rows;
  const best = cal[fam].best;
  const famName = { psi: 'PSI 阈值', test: '检验类 p 值阈值', missing: '缺失率增量阈值' };
  const imp = cal.impact_set.filter(i =>
    fam === 'psi' ? i.method === 'psi' : fam === 'test' ? (i.method === 'ks' || i.method === 'chi_square') : i.method === 'missing');

  return `
  ${card('校准方法', '把每个场景的真实影响作为「是否真的出问题」的答案，再检验不同阈值能否正确区分。',
    `<div class="notice info">
      <strong>判定基准：</strong>F1 绝对下降 ≥ ${cal.impact_delta} 记为「有实际影响」。检测器在阈值下报出漂移，与该答案比对，得到误报、漏报与检测召回。
      对照组（无任何变换）必然属于「无影响」，因此任何在它身上触发的告警都计为误报。
    </div>
    <div class="pill-row" style="margin-top:14px">
      ${Object.keys(famName).map(k =>
        `<button class="pill ${k === fam ? 'on' : ''}" data-fam="${k}">${famName[k]}</button>`).join('')}
    </div>`)}

  <div class="grid g2">
    ${card('阈值权衡曲线', '不同阈值下误报率、漏报率与检测能力的此消彼长。',
      legend([
        { c: C.red, t: '误报率' }, { c: C.amber, t: '漏报率' },
        { c: C.green, t: '检测召回' }, { c: C.blue, t: '检测精确率' },
      ]) + sweepChart(rows))}

    ${card('推荐阈值', '在检测能力与噪声之间取平衡后的推荐值，并说明其适用边界。',
      `<div class="grid" style="grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px">
        ${statCard('推荐阈值', fam === 'test' ? `p < ${best.threshold}` : `≥ ${fmt(best.threshold, 2)}`)}
        ${statCard('检测召回率', pct(best.recall), '', '', '真正有影响的场景中被检出的比例')}
        ${statCard('误报率', pct(best.false_alarm_rate), '', '', '无影响的场景被误报的比例')}
        ${statCard('漏报率', pct(best.miss_rate), '', '', '有影响的场景被漏掉的比例')}
      </div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>阈值</th><th class="num-cell">TP</th><th class="num-cell">FP</th><th class="num-cell">FN</th><th class="num-cell">TN</th><th class="num-cell">误报率</th><th class="num-cell">漏报率</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr style="${r.threshold === best.threshold ? 'background:rgba(63,185,80,.1)' : ''}">
            <td class="mono">${fam === 'test' ? 'p < ' + r.threshold : r.threshold}${r.threshold === best.threshold ? ' <span class="tag t-ok">推荐</span>' : ''}</td>
            <td class="num-cell">${r.tp}</td><td class="num-cell">${r.fp}</td>
            <td class="num-cell">${r.fn}</td><td class="num-cell">${r.tn}</td>
            <td class="num-cell" style="color:${r.false_alarm_rate > 0.3 ? C.red : 'inherit'}">${pct(r.false_alarm_rate, 0)}</td>
            <td class="num-cell" style="color:${r.miss_rate > 0.3 ? C.red : 'inherit'}">${pct(r.miss_rate, 0)}</td>
          </tr>`).join('')}</tbody>
      </table></div>`)}
  </div>

  ${card('校准明细', `参与本次校准的 ${imp.length} 个场景，逐条列出检测器输出与真实影响。`,
    `<div class="tbl-wrap"><table>
      <thead><tr><th>场景</th><th>检测字段</th><th>方法</th><th class="num-cell">统计量</th><th class="num-cell">F1</th><th class="num-cell">ΔF1</th><th>真实影响</th><th>推荐阈值下是否报出</th></tr></thead>
      <tbody>${imp.map(i => {
        const stat = i.method === 'psi' ? 'PSI ' + fmt(i.psi, 4)
          : i.method === 'missing' ? 'Δ缺失 ' + fmt(i.miss_delta, 4)
          : i.method === 'ks' ? 'KS ' + fmt(i.ks, 4) + ' / p=' + sig(i.pvalue)
          : 'χ² ' + fmt(i.chi2, 1) + ' / p=' + sig(i.pvalue);
        const detected = i.method === 'psi' ? i.psi >= best.threshold
          : i.method === 'missing' ? i.miss_delta >= best.threshold
          : i.pvalue < best.threshold;
        const correct = detected === i.impacted;
        return `<tr>
          <td>${i.name}</td>
          <td class="mono">${i.field}</td>
          <td><span class="tag t-neutral">${i.method === 'psi' ? 'PSI' : i.method === 'ks' ? 'KS' : i.method === 'chi_square' ? 'χ²' : '缺失率'}</span></td>
          <td class="num-cell">${stat}</td>
          <td class="num-cell">${fmt(i.f1, 4)}</td>
          <td class="num-cell">${deltaCell(D.baseline.metrics.f1, i.f1)}</td>
          <td>${i.impacted ? '<span class="tag t-crit">有影响</span>' : '<span class="tag t-ok">无影响</span>'}</td>
          <td>${detected ? '<span class="tag t-info">已报出</span>' : '<span class="tag t-neutral">未报出</span>'}
              ${correct ? '' : '<span class="tag t-warn">误判</span>'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`)}

  ${card('阈值的适用边界', '这一节是本平台刻意保留的免责声明。',
    `<div class="notice">
      <strong>这些阈值只对当前基准数据和压力场景负责。</strong>它们来自 ${imp.length} 个人工构造场景的实验结果，不能声称对所有数据集通用。
      更换数据分布、样本量或模型后必须重新校准。检测延迟与多时间窗口漂移属于后续版本（V1.1）能力，当前版本尚未实现。
    </div>`)}
  `;
};

/* ---------- 视图：配置导出 ---------- */
function toYaml(obj, indent = 0) {
  const pad = '  '.repeat(indent);
  let out = '';
  Object.entries(obj).forEach(([k, v]) => {
    if (v === null || v === undefined) { out += `${pad}${k}: null\n`; }
    else if (Array.isArray(v)) {
      if (v.length === 0) { out += `${pad}${k}: []\n`; return; }
      out += `${pad}${k}:\n`;
      v.forEach(it => {
        if (it && typeof it === 'object') {
          const entries = Object.entries(it);
          entries.forEach(([ik, iv], idx) => {
            const prefix = idx === 0 ? `${pad}  - ` : `${pad}    `;
            if (iv !== null && typeof iv === 'object') {
              out += `${prefix}${ik}:\n${toYaml(iv, indent + 3)}`;
            } else {
              out += `${prefix}${ik}: ${typeof iv === 'string' ? `'${iv}'` : iv}\n`;
            }
          });
        } else {
          out += `${pad}  - ${it}\n`;
        }
      });
    }
    else if (typeof v === 'object') {
      out += `${pad}${k}:\n${toYaml(v, indent + 1)}`;
    }
    else {
      out += `${pad}${k}: ${typeof v === 'string' ? `'${v}'` : v}\n`;
    }
  });
  return out;
}

function buildConfig() {
  const c = JSON.parse(JSON.stringify(D.config));
  c.generated_at = '2026-11-13T22:00:00+08:00';
  c.reference = { rows: D.meta.n_rows, seed: D.meta.seed, label_column: D.label };
  c.experiments = D.scenarios.map(s => ({
    id: s.id, detector: s.detector.method, field: s.detector.field,
    f1: s.metrics.f1, f1_delta: Number((s.metrics.f1 - D.baseline.metrics.f1).toFixed(4))
  }));
  return c;
}

    </div>`)}`;

/* ---------- 导出动作 ---------- */
function copyCfg(kind) {
  const cfg = buildConfig();
  const text = kind === 'yaml' ? toYaml(cfg) : JSON.stringify(cfg, null, 2);
  navigator.clipboard?.writeText(text).then(() => {
    const btn = [...document.querySelectorAll('.btn')].find(b => b.textContent.includes('复制'));
    if (btn) { const o = btn.textContent; btn.textContent = '已复制 ✓'; setTimeout(() => btn.textContent = o, 1400); }
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  });
}

function downloadCfg() {
  const cfg = buildConfig();
  const yaml = toYaml(cfg);
  const blob = new Blob([yaml], { type: 'text/yaml;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'monitoring_config.yaml';
  a.click();
  URL.revokeObjectURL(a.href);
}
